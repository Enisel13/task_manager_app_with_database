apiVersion: v1
#искам да има един service, който да обслужва всички pod-ове на mysql
#тоест базата има ip adress, който ако базата се рестартира, пак ще е същия и приложението няма да има проблеми с връзката. ако ползвам сержиз 
#иначе ще се генерира нов ip адрес и приложението ще трябва да се рестартира, за да може да се свърже с новия ip адрес
kind: Service
metadata:
  name: mysql-service
  #чрез labels services комуникират с базата, така един сержиз знае кое звено да обслужва
  labels:
    app: mysql
spec:
  ports:
  - port: 3306
    name: http-port
    targetPort: 3306
  selector:
    app: mysql
  clusterIP: None
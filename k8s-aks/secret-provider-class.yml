apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: task-manager-kv
  namespace: default
spec:
  provider: azure
  parameters:
    clientID: "0a786332-82c1-468b-8f65-58572e197e69"
    keyvaultName: "taskmanagerekeyvault"
    tenantId: "47444c56-d2a0-4c81-b41c-90766591dc63"
    objects: |
      array:
        - |
          objectName: mysql-password
          objectType: secret
  secretObjects:
    - secretName: mysql-credentials
      type: Opaque
      data:
        - objectName: mysql-password
          key: password
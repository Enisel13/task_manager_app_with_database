kind: Service
metadata:
  name: task-manager-service
spec:
  selector:
  #testing label matching , по принцип е app: task-manager, но за да се тества дали работи, ще го направя с label matching
    sherif: az
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80 #port-a, на който ще се достъпва от вътрешната мрежа (na pod-a)
      targetPort: 5001 #na app-a port-a (na container-a)
  
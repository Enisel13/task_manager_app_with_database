version: '3.9'

services:
  app:
    container_name: web-app
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "5002:5001"
    networks:
      - flask-sql

  mysql:
    environment:
      - MYSQL_ROOT_PASSWORD=password
    container_name: mysql
    image: mysql:8.0
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - my-volume:/var/lib/mysql
    networks:
      - flask-sql

volumes:
  my-volume:
networks:
  flask-sql:
    driver: bridge